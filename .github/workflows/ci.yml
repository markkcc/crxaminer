name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# The job only reads the repository (check out, install gems, run Brakeman),
# so its token is limited to that whatever the repository default becomes.
permissions:
  contents: read

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

